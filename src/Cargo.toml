[package]
name = "lazar"
version = "0.1.0"
edition = "2021"
description = "The smallest self-evolving agent harness"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
libc = "0.2"
agent-client-protocol = "2"
async-io = "2"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
