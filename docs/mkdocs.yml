site_name: lazar
site_description: Documentation for the lazar self-evolving agent harness
docs_dir: docs/

nav:
  - Home: index.md
  - Getting Started:
      - Install: getting-started/install.md
      - Configuration: getting-started/configuration.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Sandbox: concepts/sandbox.md
      - Kernel guardrails: concepts/kernel-guardrails.md
  - CLI:
      - lazar: cli/lazar.md
      - lazar-spawn: cli/lazar-spawn.md
      - Scripts: cli/scripts.md
  - API:
      - Output formats: api/output-formats.md
      - Provider protocol: api/provider.md
      - Environment variables: api/env-vars.md
  - Integration:
      - Sessions: integration/sessions.md
      - Hooks: integration/hooks.md
      - Skills: integration/skills.md
      - Sub-agents: integration/subagents.md
      - Memory: integration/memory.md
  - Reference:
      - Skills catalogue: reference/skills-catalogue.md
      - Eval harness: reference/eval-harness.md
      - Glossary: reference/glossary.md

theme:
  name: material
  font:
    text: "Roboto"
    code: "Roboto Mono"
  features:
    - content.action.edit
    - navigation.sections
    - navigation.top
  icon:
    logo: material/robot
    repo: simple/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Placeholder — no public repo yet. Operator can fix later.
edit_uri: edit/main/workspace/lazar-docs-site/docs/
repo_url: https://github.com/jkneen/lazar

markdown_extensions:
  - toc:
      permalink: "#"
  - admonition
  - extra
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables

extra:
  generator: false
